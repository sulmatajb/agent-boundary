name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Deterministic suite (no model access)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Documentation, license, and focused secret checks
        run: python scripts/release_check.py
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-boundary-wheel"
          "$RUNNER_TEMP/agent-boundary-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/agent-boundary-wheel/bin/agent-boundary" --help
          "$RUNNER_TEMP/agent-boundary-wheel/bin/agent-boundary" --backend deterministic
          "$RUNNER_TEMP/agent-boundary-wheel/bin/python" -m agent_boundary.server --help
          "$RUNNER_TEMP/agent-boundary-wheel/bin/python" -m agent_boundary.tool_service --help
